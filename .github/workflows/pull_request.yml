name: CICD NodeJs

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      node-version: "20"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      id: node-setup
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install dependencies
      run: npm install

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: setup

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install dependencies
      run: npm install

  test:
    name: Test/Coverage
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install dependencies
      run: npm install

    - name: Run tests with coverage
      run: npm run test:ci

    - name: Upload Coverage Results
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage

  lint:
    name: Eslint
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install dependencies
      run: npm install

    - name: Run ESLint
      run: npm run lint
